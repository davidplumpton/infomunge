<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InfoMunge Playground</title>
    <style>
      :root {
        --ink: #1f1b16;
        --accent: #d56733;
        --bg: #f4efe9;
        --panel: #fffdf8;
        --border: #e3d9cd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        color: var(--ink);
        background: radial-gradient(circle at top left, #fff8ef 0%, var(--bg) 45%, #f1e7dc 100%);
      }
      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 24px;
        gap: 16px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.5px;
      }
      header p {
        margin: 0;
        font-size: 14px;
        opacity: 0.7;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      .toolbar button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 10px 18px;
        font-size: 14px;
        border-radius: 18px;
        cursor: pointer;
      }
      .toolbar button:hover {
        opacity: 0.9;
      }
      .toolbar select {
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 12px;
        background: var(--panel);
      }
      .layout {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(260px, 1.2fr) minmax(220px, 1fr);
        gap: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }
      .panel h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
      .inputs-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .inputs-header button {
        border: 1px dashed var(--border);
        background: transparent;
        padding: 6px 12px;
        border-radius: 12px;
        cursor: pointer;
      }
      .input-card {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px;
        display: grid;
        gap: 8px;
      }
      .input-card input,
      .input-card select,
      .input-card textarea,
      #script,
      #result {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        background: #fffefb;
      }
      .input-card textarea {
        min-height: 110px;
        resize: vertical;
      }
      #script {
        flex: 1;
        min-height: 260px;
        resize: vertical;
      }
      #result {
        flex: 1;
        min-height: 260px;
        resize: none;
        background: #f9f4ee;
      }
      .status {
        font-size: 13px;
        color: #7b4b32;
      }
      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>InfoMunge Playground</h1>
          <p>Draft inputs, write scripts, and see results instantly.</p>
        </div>
        <p>Standalone mode • Local JS runner</p>
      </header>
      <div class="toolbar">
        <button id="run-script" type="button">Run Script</button>
        <label>
          Examples
          <select id="example-picker">
            <option value="">choose an example</option>
          </select>
        </label>
        <label>
          Output format
          <select id="output-format">
            <option value="">auto (script header)</option>
            <option value="json">json</option>
            <option value="xml">xml</option>
            <option value="csv">csv</option>
            <option value="yaml">yaml</option>
            <option value="text/plain">text</option>
          </select>
        </label>
      </div>
      <main class="layout">
        <section class="panel" id="inputs-panel">
          <div class="inputs-header">
            <h2>Inputs</h2>
            <button id="add-input" type="button">+ Add input</button>
          </div>
          <div id="inputs-list"></div>
        </section>
        <section class="panel" id="script-panel">
          <h2>Script</h2>
          <textarea id="script">%im 0.1
output application/json
---
payload</textarea>
        </section>
        <section class="panel" id="result-panel">
          <h2>Result</h2>
          <textarea id="result" readonly></textarea>
          <div class="status" id="status"></div>
        </section>
      </main>
    </div>
    <script src="infomunge.js"></script>
    <script>
      const inputsList = document.getElementById("inputs-list");
      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const examplePicker = document.getElementById("example-picker");
      const outputFormat = document.getElementById("output-format");
      const scriptArea = document.getElementById("script");

      const examples = [
        {
          id: "group-report",
          name: "Group totals by type",
          output: "",
          script:
            "%im 0.1\n" +
            "fun sum(nums) = nums reduce (acc, n) -> acc + n\n" +
            "output application/xml\n" +
            "---\n" +
            "{\n" +
            "  report @(generated: \"true\"): {\n" +
            "    types: payload\n" +
            "      groupBy (t) -> t.type\n" +
            "      mapObject (v, k) -> [k, {\n" +
            "        count: sizeOf(v),\n" +
            "        total: sum(v map (e) -> e.amount)\n" +
            "      }]\n" +
            "  }\n" +
            "}\n",
          inputs: [
            {
              name: "payload",
              format: "json",
              content:
                "[\n" +
                "  {\"type\": \"A\", \"amount\": 10},\n" +
                "  {\"type\": \"B\", \"amount\": 4},\n" +
                "  {\"type\": \"A\", \"amount\": 6},\n" +
                "  {\"type\": \"B\", \"amount\": 1}\n" +
                "]\n",
            },
          ],
        },
        {
          id: "active-users",
          name: "Filter active users",
          output: "",
          script:
            "%im 0.1\n" +
            "output application/json\n" +
            "---\n" +
            "payload\n" +
            "  filter (u) -> u.active\n" +
            "  map (u) -> {id: u.id, email: u.email}\n",
          inputs: [
            {
              name: "payload",
              format: "json",
              content:
                "[\n" +
                "  {\"id\": 1, \"email\": \"a@example.com\", \"active\": true},\n" +
                "  {\"id\": 2, \"email\": \"b@example.com\", \"active\": false},\n" +
                "  {\"id\": 3, \"email\": \"c@example.com\", \"active\": true}\n" +
                "]\n",
            },
          ],
        },
        {
          id: "join-inputs",
          name: "Combine two inputs",
          output: "",
          script:
            "%im 0.1\n" +
            "output application/json\n" +
            "---\n" +
            "payload map (item) -> item ++ {totalUSD: item.amount * rates.usd}\n",
          inputs: [
            {
              name: "payload",
              format: "json",
              content:
                "[\n" +
                "  {\"sku\": \"A-100\", \"amount\": 12},\n" +
                "  {\"sku\": \"B-200\", \"amount\": 5}\n" +
                "]\n",
            },
            {
              name: "rates",
              format: "json",
              content: "{\n  \"usd\": 1.09\n}\n",
            },
          ],
        },
      ];

      function createInputCard(index, preset) {
        const card = document.createElement("div");
        card.className = "input-card";
        const defaultName =
          preset && preset.name
            ? preset.name
            : index === 0
            ? "payload"
            : "input" + (index + 1);
        card.innerHTML =
          '<label>Input name <input type="text" value="' + defaultName + '" /></label>' +
          '<label>Format' +
          '  <select>' +
          '    <option value="">auto</option>' +
          '    <option value="json">json</option>' +
          '    <option value="xml">xml</option>' +
          '    <option value="csv">csv</option>' +
          '    <option value="yaml">yaml</option>' +
          '    <option value="text/plain">text</option>' +
          '  </select>' +
          '</label>' +
          '<label>Content <textarea placeholder="Paste input data here"></textarea></label>';
        if (preset) {
          card.querySelector("select").value = preset.format || "";
          card.querySelector("textarea").value = preset.content || "";
        }
        return card;
      }

      function addInputCard(preset) {
        const card = createInputCard(inputsList.children.length, preset);
        inputsList.appendChild(card);
      }

      function setInputs(exampleInputs) {
        inputsList.innerHTML = "";
        if (exampleInputs && exampleInputs.length) {
          exampleInputs.forEach((input, index) => {
            inputsList.appendChild(createInputCard(index, input));
          });
          return;
        }
        addInputCard();
      }

      function resetOutput() {
        status.textContent = "";
        result.value = "";
      }

      function collectInputs() {
        const inputs = [];
        Array.from(inputsList.children).forEach((card) => {
          const name = card.querySelector("input").value.trim();
          const format = card.querySelector("select").value;
          const content = card.querySelector("textarea").value;
          if (!name) {
            return;
          }
          inputs.push({
            name,
            format: format || undefined,
            content,
          });
        });
        return inputs;
      }

      function applyExample(example) {
        if (!example) {
          return;
        }
        scriptArea.value = example.script || "";
        outputFormat.value = example.output || "";
        setInputs(example.inputs);
        resetOutput();
      }

      function populateExamples() {
        examples.forEach((example) => {
          const option = document.createElement("option");
          option.value = example.id;
          option.textContent = example.name;
          examplePicker.appendChild(option);
        });
      }

      function onExampleChange() {
        const selected = examples.find((example) => example.id === examplePicker.value);
        applyExample(selected);
      }

      async function runScript() {
        const script = scriptArea.value;
        const output = outputFormat.value;
        const payload = {
          script,
          output,
          inputs: collectInputs(),
        };
        status.textContent = "Running...";
        result.value = "";
        try {
          if (window.infomungeRun) {
            const response = window.infomungeRun(JSON.stringify(payload));
            result.value = response && response.result ? response.result : "";
            if (response && response.ok) {
              status.textContent = "Success";
            } else {
              const message = response && response.error ? response.error : "Unknown error";
              status.textContent = "Error";
              result.value = message;
            }
            return;
          }
          status.textContent = "Error: infomunge.js not loaded";
        } catch (err) {
          status.textContent = "Error: " + err;
        }
      }

      document.getElementById("run-script").addEventListener("click", runScript);
      document.getElementById("add-input").addEventListener("click", addInputCard);
      examplePicker.addEventListener("change", onExampleChange);
      populateExamples();
      addInputCard();
    </script>
  </body>
</html>
